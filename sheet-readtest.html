<!doctype html><html lang="ko"><head><meta charset="utf-8"><title>판독 시험</title>
<style>body{margin:0;background:#333;font-family:sans-serif;color:#fff}
#stage{position:absolute;left:0;top:0}</style></head><body>
<div id="stage"></div><canvas id="warp"></canvas>
<script type="module">
import { sheetHTML, measureSheet, SHEET_CSS } from "./js/sheetform.js";
import { ROSTER as CLUB } from "./js/roster.js";
import { detectFiducials, readBubbles, readingsToTeam, debugOverlay, readSheetRoster } from "./js/sheetread.js";

const style = document.createElement("style");
style.textContent = SHEET_CSS;
document.head.appendChild(style);

// 세 번째 값은 동아리 로스터에서 몇 번째인지 — 이게 종이에 버블로 찍혀서
// 사진을 올리는 사람이 누구든 이름이 나온다.
const ROSTER = [[55,"조보규"],[1,"김창범"],[35,"황규철"],[23,"김준석"],[2,"김웅기"],
                [69,"조우진"],[10,"배준혁"],[24,"김도여"],[null,""]]
  .map(([no, name]) => [no, name, CLUB.findIndex((p) => p.name === name)]);

// 시험용 정답. 이 값들을 칠해 두고, 판독기가 같은 값을 돌려주는지 본다.
const TRUTH = {
  0: { q:[1,3], p2:{1:[["m","black"],["x","black"],["x","black"]],2:[["m","black"],["x","black"]]},
       p3:{1:[["x","black"]],2:[]}, ft:{1:[["m","black"],["x","black"]],2:[]},
       reb:[["black",4]], ast:[["black",2]], stl:[["black",1]], blk:[], to:[["black",1]], pf:[["black",2]] },
  1: { q:[1,2,3,4], p2:{1:[["m","black"],["m","red"],["x","red"]],2:[["m","black"],["x","red"]]},
       p3:{1:[["m","red"]],2:[["x","black"]]}, ft:{1:[],2:[["m","black"],["m","black"]]},
       reb:[["black",3],["red",4]], ast:[["red",2]], stl:[["black",2]], blk:[["red",1]], to:[["black",1],["red",1]], pf:[["red",1]] },
  2: { q:[2,4], p2:{1:[["m","red"],["m","red"],["x","red"]],2:[["x","red"]]},
       p3:{1:[],2:[["m","red"]]}, ft:{1:[["x","red"]],2:[]},
       reb:[["red",6]], ast:[["red",1]], stl:[], blk:[["red",2]], to:[["red",3]], pf:[["red",2]] },
};

// 정답대로 칠하기
function paint(sheet) {
  const set = (id, color) => {
    const el = sheet.querySelector(`[data-bub="${id}"]`);
    if (!el) throw new Error("없는 버블: " + id);
    el.style.background = color === "red" ? "#cf2b20" : "#111111";
    el.style.borderColor = color === "red" ? "#cf2b20" : "#111111";
  };
  for (const [pi, d] of Object.entries(TRUTH)) {
    for (const q of d.q) set(`q:${pi}:${q}`, "black");
    for (const stat of ["p2","p3","ft"]) {
      for (const half of [1,2]) {
        (d[stat][half] || []).forEach(([res, color], i) => set(`s:${pi}:${stat}:${half}:${i}:${res}`, color));
      }
    }
    for (const stat of ["reb","ast","stl","blk","to","pf"]) {
      let k = 0;
      for (const [color, n] of (d[stat] || [])) for (let j = 0; j < n; j++, k++) set(`c:${pi}:${stat}:${k}`, color);
    }
  }
}

// 정답을 기대 기록으로 환산
function expectedTeam() {
  const players = ROSTER.map(([no,name]) => ({no,name,quarters:[],p2m:0,p2a:0,p3m:0,p3a:0,ftm:0,fta:0,
    reb:0,ast:0,stl:0,blk:0,to:0,pf:0}));
  for (const [pi, d] of Object.entries(TRUTH)) {
    const p = players[pi];
    p.quarters = [...d.q].sort();
    for (const stat of ["p2","p3","ft"]) for (const half of [1,2])
      for (const [res] of (d[stat][half]||[])) { p[stat+"a"]++; if (res==="m") p[stat+"m"]++; }
    for (const stat of ["reb","ast","stl","blk","to","pf"])
      for (const [,n] of (d[stat]||[])) p[stat] += n;
  }
  return players;
}

// 1단계: 종이를 그리고 정답대로 칠한다. 좌표를 재서 남겨둔다.
window.__setup = () => {
  const stage = document.getElementById("stage");
  stage.innerHTML = sheetHTML({ date:"2026-08-23", gameNo:1, us:"혼 A", them:"혼 B",
    roster: ROSTER, code:"260823_1|혼 A" });
  const sheet = stage.querySelector(".sheet");
  paint(sheet);
  window.__geom = measureSheet(sheet);
  return { bubbles: window.__geom.bubbles.length };
};

// 판독기는 **빈 기록지**를 재어 좌표를 얻고, 사진은 **이름이 든 기록지**를 찍은 것이다.
// 둘이 조금이라도 다르게 배치되면 판독은 조용히 어긋난다. 실제로 어긋났었다 —
// 꼬리글이 글자 길이대로 흘러서 코드 버블이 가로로 13.5mm 밀렸고, 머리글 높이가
// 0.21mm 달라 표 전체가 세로로 밀렸다. 그래서 "내용이 달라도 좌표는 같다"를 못 박아 둔다.
window.__geomStability = () => {
  const mk = (opts) => {
    const h = document.createElement("div");
    h.style.cssText = "position:absolute;left:-99999px;top:0;width:297mm;background:#fff";
    document.body.appendChild(h);
    h.innerHTML = sheetHTML(opts);
    const g = measureSheet(h.querySelector(".sheet"));
    h.remove();
    return g;
  };
  const A = mk({ roster: [] });
  const B = mk({ date:"2026-08-23", gameNo:1, us:"혼 A", them:"혼 B", roster: ROSTER, code:"260823_1|혼 A" });
  let maxdx = 0, maxdy = 0, moved = 0;
  for (let i = 0; i < A.bubbles.length; i++) {
    const dx = Math.abs(B.bubbles[i].cx - A.bubbles[i].cx);
    const dy = Math.abs(B.bubbles[i].cy - A.bubbles[i].cy);
    if (dx > 0.02 || dy > 0.02) moved++;
    maxdx = Math.max(maxdx, dx); maxdy = Math.max(maxdy, dy);
  }
  return { n: A.bubbles.length, moved, maxdx: +maxdx.toFixed(3), maxdy: +maxdy.toFixed(3) };
};

// 2단계: 찍힌 사진(dataURL)을 실제 사진처럼 망가뜨린 뒤, 찾아서 읽고 정답과 대조한다.
window.__run = async (dataUrl, opts) => {
  const img = new Image();
  await new Promise((res, rej) => { img.onload = res; img.onerror = () => rej(new Error("사진 못 읽음")); img.src = dataUrl; });

  const W = Math.round(img.width * 1.15), H = Math.round(img.height * 1.15);
  const cv = document.getElementById("warp");
  cv.width = W; cv.height = H;
  const ctx = cv.getContext("2d", { willReadFrequently: true });
  ctx.fillStyle = opts.bg || "#8a8f99";
  ctx.fillRect(0, 0, W, H);

  const k = opts.warp ?? 0;
  const q = [
    { x: W*0.05 + W*k, y: H*0.05 },
    { x: W*0.95,        y: H*0.05 + H*k*0.6 },
    { x: W*0.95 - W*k,  y: H*0.95 },
    { x: W*0.05,        y: H*0.95 - H*k*0.6 },
  ];

  if (opts.fold) {
    // 종이를 반으로 접었다 편 자국: 왼쪽/오른쪽 반을 살짝 다른 면으로 그린다.
    const mid = { x: (q[0].x + q[1].x) / 2, y: (q[0].y + q[1].y) / 2 - H * opts.fold };
    const midB = { x: (q[3].x + q[2].x) / 2, y: (q[3].y + q[2].y) / 2 - H * opts.fold };
    drawHalf(ctx, img, 0, 0.5, [q[0], mid, midB, q[3]]);
    drawHalf(ctx, img, 0.5, 1, [mid, q[1], q[2], midB]);
  } else {
    drawQuad(ctx, img, q);
  }

  // 종이가 평평하지 않아 **안쪽**만 밀리는 경우. 네 귀퉁이는 멀쩡하니 귀퉁이
  // 표식만으로는 이걸 볼 방법이 아예 없다 — 실제 사진에서 재 보니 가로 -4~+12px,
  // 세로 -13~+12px 이었고, 버블 세로 반지름이 9.4px 이라 옆 줄을 읽고 있었다.
  // 눈금 표식이 있어야 잡히는 경우라서 시험에 넣어 둔다.
  if (opts.bulge) {
    const src = ctx.getImageData(0, 0, W, H);
    const out = ctx.createImageData(W, H);
    // 밀림의 크기는 **종이 위 mm** 로 정한다. px 로 적어 두면 사진 해상도에 따라
    // 시험 난이도가 제멋대로 바뀐다. 실제 사진(가로 2200px)에서 잰 값이 13px ≒ 1.75mm.
    const g = opts.bulge * (W / 2200);
    for (let y = 0; y < H; y++) {
      for (let x = 0; x < W; x++) {
        const u = x / (W - 1), v = y / (H - 1);
        const s = Math.sin(Math.PI * u) * Math.sin(Math.PI * v); // 가장자리에서 0
        const dx = s * (12 * u - 4) * g, dy = s * (13 * Math.sin(Math.PI * 2 * v) + 6 * u) * g;
        const ix = Math.max(0, Math.min(W - 1, Math.round(x - dx)));
        const iy = Math.max(0, Math.min(H - 1, Math.round(y - dy)));
        const si = (iy * W + ix) * 4, di = (y * W + x) * 4;
        out.data[di] = src.data[si]; out.data[di+1] = src.data[si+1];
        out.data[di+2] = src.data[si+2]; out.data[di+3] = 255;
      }
    }
    ctx.putImageData(out, 0, 0);
  }

  if (opts.shade) {
    const g = ctx.createLinearGradient(0, 0, W, H);
    g.addColorStop(0, "rgba(0,0,0,0)");
    g.addColorStop(0.5, `rgba(0,0,0,${opts.shade * 0.5})`);
    g.addColorStop(1, `rgba(0,0,0,${opts.shade})`);
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  }
  if (opts.bright) { // 한쪽이 하얗게 날아간 경우
    const g = ctx.createRadialGradient(W*0.4, H*0.4, 0, W*0.4, H*0.4, W*0.6);
    g.addColorStop(0, `rgba(255,255,255,${opts.bright})`);
    g.addColorStop(1, "rgba(255,255,255,0)");
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  }

  // 흐림 + JPEG 뭉개짐
  if (opts.blur || opts.jpeg) {
    const tmp = document.createElement("canvas");
    tmp.width = W; tmp.height = H;
    const t = tmp.getContext("2d");
    if (opts.blur) t.filter = `blur(${opts.blur}px)`;
    t.drawImage(cv, 0, 0);
    let src = tmp;
    if (opts.jpeg) {
      const jp = new Image();
      await new Promise((res) => { jp.onload = res; jp.src = tmp.toDataURL("image/jpeg", opts.jpeg); });
      ctx.clearRect(0, 0, W, H);
      ctx.drawImage(jp, 0, 0);
      src = null;
    }
    if (src) { ctx.clearRect(0, 0, W, H); ctx.drawImage(src, 0, 0); }
  }

  const idata = ctx.getImageData(0, 0, W, H);
  const found = detectFiducials(idata);
  if (!found) return { ok:false, why:"귀퉁이 못 찾음" };
  const readings = readBubbles(idata, found, window.__geom);
  const got = readingsToTeam(readings, ROSTER);

  const want = expectedTeam();
  const diffs = [];
  const KEYS = ["p2m","p2a","p3m","p3a","ftm","fta","reb","ast","stl","blk","to","pf"];
  want.forEach((w, i) => {
    const g2 = got.players[i];
    if (w.quarters.join() !== g2.quarters.join())
      diffs.push(`${w.name||"(예비)"} 출전 기대[${w.quarters}] 실제[${g2.quarters}]`);
    for (const k2 of KEYS) if (w[k2] !== g2[k2]) diffs.push(`${w.name||"(예비)"} ${k2} 기대${w[k2]} 실제${g2[k2]}`);
  });
  // 종이에 찍힌 명단이 그대로 되살아나는지 — 사진 올리는 사람이 누구든 이름이 나와야 한다
  const paper = readSheetRoster(readings, CLUB);
  ROSTER.forEach(([, name], i) => {
    const got = paper.rows[i] ? paper.rows[i].name : "";
    if ((name || "") !== got) diffs.push(`${i + 1}줄 이름 기대"${name}" 실제"${got}"`);
  });

  window.__lastOverlay = () => debugOverlay(idata, found, readings).toDataURL("image/png");
  return { ok: diffs.length === 0, filled: got.filled, diffs: diffs.slice(0, 20), total: diffs.length,
           cut: readings.threshold, size: [W, H], names: `${paper.read}명`,
           ticks: `${readings.tickHits}/${readings.tickTotal}`, corrected: readings.corrected };
};

// 이미지의 가로 [a,b] 구간만 사변형에 그린다 (접힌 자국 흉내)
function drawHalf(ctx, img, a, b, quad) {
  const tmp = document.createElement("canvas");
  tmp.width = Math.round(img.width * (b - a));
  tmp.height = img.height;
  tmp.getContext("2d").drawImage(img, -img.width * a, 0);
  drawQuad(ctx, tmp, quad);
}

// 사변형에 이미지 채우기 — 삼각형 두 개 아핀 변환으로 근사
function drawQuad(ctx, img, q) {
  const w = img.width, h = img.height;
  tri(ctx, img, [[0,0],[w,0],[0,h]], [q[0],q[1],q[3]]);
  tri(ctx, img, [[w,0],[w,h],[0,h]], [q[1],q[2],q[3]]);
}
function tri(ctx, img, s, d) {
  const [[x0,y0],[x1,y1],[x2,y2]] = s;
  const den = (x1-x0)*(y2-y0) - (x2-x0)*(y1-y0);
  const a = ((d[1].x-d[0].x)*(y2-y0) - (d[2].x-d[0].x)*(y1-y0)) / den;
  const b = ((d[2].x-d[0].x)*(x1-x0) - (d[1].x-d[0].x)*(x2-x0)) / den;
  const c = ((d[1].y-d[0].y)*(y2-y0) - (d[2].y-d[0].y)*(y1-y0)) / den;
  const dd= ((d[2].y-d[0].y)*(x1-x0) - (d[1].y-d[0].y)*(x2-x0)) / den;
  ctx.save();
  ctx.beginPath();
  ctx.moveTo(d[0].x,d[0].y); ctx.lineTo(d[1].x,d[1].y); ctx.lineTo(d[2].x,d[2].y); ctx.closePath();
  ctx.clip();
  ctx.transform(a,c,b,dd, d[0].x - a*x0 - b*y0, d[0].y - c*x0 - dd*y0);
  ctx.drawImage(img,0,0);
  ctx.restore();
}
</script></body></html>
