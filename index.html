<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>혼(Spirit)</title>
  <meta name="description" content="농구 동호회 혼(Spirit)의 홈페이지" />
  <link rel="icon" type="image/png" href="assets/favicon.png" />

  <!-- 카톡·SNS에 링크를 붙였을 때 뜨는 미리보기 카드.
       og:url / og:image 는 절대 주소여야 해서, 배포 워크플로가 실제 Pages 주소로 바꿔 넣는다
       (아래 값은 로컬에서 열어볼 때를 위한 기본값). -->
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="혼(Spirit)" />
  <meta property="og:title" content="혼(Spirit) — 농구 동호회 홈페이지" />
  <meta property="og:description" content="전술 · 팀 편성 · 일정 · 로스터. 한 팀, 한 코트, 하나의 혼(Spirit)." />
  <meta property="og:locale" content="ko_KR" />
  <meta property="og:url" content="https://raptter123.github.io/spirit-basketball/" />
  <meta property="og:image" content="https://raptter123.github.io/spirit-basketball/assets/og-card.png" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta property="og:image:alt" content="혼(Spirit) 농구 동호회 홈페이지" />
  <meta name="twitter:card" content="summary_large_image" />
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#14102b" />
  <link rel="apple-touch-icon" href="assets/icon-180.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="혼 Spirit" />
  <link rel="stylesheet" href="css/style.css" />
  <!-- 배포판 번호. 배포 워크플로가 "<실행번호> · <커밋 앞 8자>" 로 갈아 끼운다.
       화면 맨 아래에 이 값을 찍어 두면 "내 폰이 최신인지"를 눈으로 바로 확인할 수 있다.
       index.html 은 캐시 무효화를 안 걸어서 브라우저가 옛 걸 들고 있을 수 있는데,
       그 옛 index.html 이 어떤 js/css 를 부를지도 정해 주므로 이 번호가 곧 지금 돌고
       있는 판본이다. 값이 그대로 dev 면 로컬에서 직접 연 것이다. -->
  <meta name="app-rev" content="dev" />
  <script>
    // 첫 페인트 전에 테마를 정해야 밝은/어두운 화면이 번쩍이지 않는다.
    // 저장된 선택이 없으면 기기 설정(prefers-color-scheme)을 따른다.
    (function () {
      var theme = "dark";
      try {
        var saved = localStorage.getItem("spirit-theme");
        if (saved === "light" || saved === "dark") {
          theme = saved;
        } else if (window.matchMedia && window.matchMedia("(prefers-color-scheme: light)").matches) {
          theme = "light";
        }
      } catch (e) {
        /* 프라이빗 모드 등 localStorage 접근 불가 — 기본 다크로 둔다 */
      }
      document.documentElement.setAttribute("data-theme", theme);
      // 상단바 색도 여기서 같이 맞춘다. app.js 가 뜨기 전까지 예전 색이 잠깐 비쳤었다.
      var meta = document.querySelector('meta[name="theme-color"]');
      if (meta) meta.setAttribute("content", theme === "light" ? "#fff3dd" : "#14102b");
    })();
  </script>
</head>
<body>
  <header class="site-header">
    <a class="brand" href="#/">
      <img class="brand-logo brand-logo-dark" src="assets/logo-dark.svg" alt="혼(Spirit) 로고" />
      <img class="brand-logo brand-logo-light" src="assets/logo-light.svg" alt="" aria-hidden="true" />
      <span class="brand-text">
        <span class="brand-title">혼<span class="brand-title-accent">(Spirit)</span></span>
        <span class="brand-tagline">PLAY WITH SPIRIT, PLAY WITH 혼(魂)</span>
      </span>
    </a>
    <button type="button" id="theme-toggle" class="theme-toggle" aria-label="밝은 화면으로 전환">☀️</button>
  </header>
  <!-- 메뉴는 두 갈래다: 사이트 안으로 가는 것(.utility-nav)과 밖으로 나가는 것(.utility-links).
       폰에서는 일곱 개가 한 줄에 안 들어가므로 이 두 묶음 단위로 줄바꿈된다. 묶어 두지 않으면
       화면 너비에 따라 "기록 보관실"만 윗줄에 끼는 어중간한 모양이 나온다. -->
  <div class="utility-bar">
    <nav class="utility-nav" aria-label="주요 메뉴">
      <a href="#/tactics" data-nav="tactics">전술</a>
      <a href="#/board" data-nav="board">작전판</a>
      <a href="#/schedule" data-nav="schedule">일정</a>
      <a href="#/team-shuffle" data-nav="team-shuffle">팀 편성</a>
      <a href="#/roster" data-nav="roster">로스터</a>
    </nav>
    <div class="utility-links">
      <a class="utility-external" href="https://kimjunseok.github.io/Spirit/" target="_blank" rel="noopener">기록 보관실 ↗</a>
      <a class="utility-external" href="https://band.us/band/47755703" target="_blank" rel="noopener">출석체크 ↗</a>
    </div>
  </div>
  <main id="app"></main>
  <footer class="site-foot"><span id="app-rev" class="app-rev"></span></footer>
  <script type="module" src="js/app.js"></script>
</body>
</html>
