<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>혼(Spirit)</title>
  <meta name="description" content="농구 동호회 혼(Spirit)의 홈페이지" />
  <link rel="icon" type="image/png" href="assets/favicon.png" />
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#0f172a" />
  <link rel="apple-touch-icon" href="assets/icon-180.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="혼 Spirit" />
  <link rel="stylesheet" href="css/style.css" />
  <script>
    // 첫 페인트 전에 테마를 정해야 밝은/어두운 화면이 번쩍이지 않는다.
    // 저장된 선택이 없으면 기기 설정(prefers-color-scheme)을 따른다.
    (function () {
      var theme = "dark";
      try {
        var saved = localStorage.getItem("spirit-theme");
        if (saved === "light" || saved === "dark") {
          theme = saved;
        } else if (window.matchMedia && window.matchMedia("(prefers-color-scheme: light)").matches) {
          theme = "light";
        }
      } catch (e) {
        /* 프라이빗 모드 등 localStorage 접근 불가 — 기본 다크로 둔다 */
      }
      document.documentElement.setAttribute("data-theme", theme);
    })();
  </script>
</head>
<body>
  <header class="site-header">
    <a class="brand" href="#/">
      <img class="brand-logo brand-logo-dark" src="assets/logo-dark.svg" alt="혼(Spirit) 로고" />
      <img class="brand-logo brand-logo-light" src="assets/logo-light.svg" alt="" aria-hidden="true" />
      <span class="brand-text">
        <span class="brand-title">혼<span class="brand-title-accent">(Spirit)</span></span>
        <span class="brand-tagline">PLAY WITH SPIRIT, PLAY WITH 혼(魂)</span>
      </span>
    </a>
    <button type="button" id="theme-toggle" class="theme-toggle" aria-label="밝은 화면으로 전환">☀️</button>
  </header>
  <div class="utility-bar">
    <a href="#/tactics" data-nav="tactics">전술</a>
    <a href="#/schedule" data-nav="schedule">일정</a>
    <a href="#/team-shuffle" data-nav="team-shuffle">팀 편성</a>
    <a href="#/roster" data-nav="roster">로스터</a>
    <a href="https://kimjunseok.github.io/Spirit/" target="_blank" rel="noopener">기록 보관실 ↗</a>
    <a href="https://band.us/band/47755703" target="_blank" rel="noopener">출석체크 ↗</a>
  </div>
  <main id="app"></main>
  <script type="module" src="js/app.js"></script>
</body>
</html>
