name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Point share-card tags at this repository's Pages URL
        run: |
          # 저장소 이름이 바뀌어도 따라가도록 github.repository 에서 직접 만든다.
          OWNER="${{ github.repository_owner }}"
          NAME="${{ github.event.repository.name }}"
          BASE="https://${OWNER,,}.github.io/${NAME}/"
          sed -i -E "s#(property=\"og:url\" content=\")[^\"]*#\1${BASE}#" index.html
          sed -i -E "s#(property=\"og:image\" content=\")[^\"]*#\1${BASE}assets/og-card.png#" index.html
          grep -E 'og:(url|image)"' index.html

      - name: Stamp the build revision
        run: |
          # 화면 맨 아래에 찍히는 번호. 실행번호는 배포할 때마다 1씩 늘어서 눈으로 비교하기
          # 쉽고, 커밋 앞 8자는 어느 코드인지 되짚을 때 쓴다.
          SHA_SHORT=$(echo "${{ github.sha }}" | cut -c1-8)
          sed -i -E "s#(<meta name=\"app-rev\" content=\")[^\"]*#\1${{ github.run_number }} · ${SHA_SHORT}#" index.html
          grep -F 'name="app-rev"' index.html

      - name: Cache-bust JS/CSS references
        run: |
          SHA_SHORT=$(echo "${{ github.sha }}" | cut -c1-8)
          sed -i -E "s#src=\"js/app\.js\"#src=\"js/app.js?v=${SHA_SHORT}\"#" index.html
          sed -i -E "s#href=\"css/style\.css\"#href=\"css/style.css?v=${SHA_SHORT}\"#" index.html
          # 파일명에 하이픈이 들어간 모듈(team-shuffle.js, xlsx-lite.js …)도 잡아야 한다.
          # [a-zA-Z]+ 로는 안 잡혀서 그 파일들만 캐시가 안 비워지고 있었다.
          find js -name "*.js" -exec sed -i -E "s#from \"(\./[a-zA-Z0-9_-]+\.js)\"#from \"\1?v=${SHA_SHORT}\"#g" {} \;
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: "."
      - id: deployment
        uses: actions/deploy-pages@v4
